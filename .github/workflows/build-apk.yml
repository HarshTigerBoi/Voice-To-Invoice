name: Build APK

# Lets the app be built and installed on the phone with the laptop off:
# push to master (or a manual dispatch from any branch) builds a debug APK
# and attaches it to a GitHub Release. Open the release link on the phone
# and tap it to install -- no adb, no USB, no local Gradle run.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 + build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Neutralize local-machine-only Gradle settings
        # gradle.properties on some branches pins org.gradle.java.home to a Windows
        # Android Studio path for the dev laptop; that path doesn't exist on this
        # runner. No-op if the line isn't present (e.g. on master today).
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Build debug APK
        env:
          # Some branches relocate buildDir to C:/VTI_build (a Windows-only path, to
          # keep OneDrive off the build output on the dev laptop) via this env var,
          # read in the root build.gradle.kts. Point it at the runner workspace
          # instead; it's a no-op on branches that don't read it (e.g. master today).
          VTI_BUILD_DIR: ${{ github.workspace }}/build-out
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and rename APK
        run: |
          for CANDIDATE in \
            "$GITHUB_WORKSPACE/build-out/app/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"; do
            if [ -f "$CANDIDATE" ]; then APK_SRC="$CANDIDATE"; break; fi
          done
          test -n "$APK_SRC"
          APK_OUT="VoiceToInvoice-v${{ github.run_number }}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "APK_OUT=$APK_OUT" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "VoiceToInvoice build ${{ github.run_number }} (${{ github.sha }})"
          prerelease: true
          files: ${{ env.APK_OUT }}
